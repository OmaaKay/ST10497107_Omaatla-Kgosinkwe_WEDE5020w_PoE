name: RaceDay CI

on:
  push:
    branches:
      - main
      - master
      - 'part2/**'
      - 'part3/**'
  pull_request:

jobs:
  build-and-test:
    name: Build API + MVC and run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          for f in README.md Dockerfile RaceDay.sln RaceDay.Api/RaceDay.Api.csproj RaceDay.Mvc/RaceDay.Mvc.csproj; do
            test -e "$f" || { echo "::error::Missing required file: $f"; exit 1; }
          done
          echo "Repository structure OK"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies (API, MVC, tests)
        run: dotnet restore RaceDay.sln

      - name: Build API and MVC projects
        run: dotnet build RaceDay.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.sln --no-build --configuration Release --verbosity normal

  docker-build:
    name: Build MVC Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build MVC image
        run: docker build -t raceday-mvc:ci .
